# jj デフォルト設定ファイル
# このファイルは `jj init` で .jj/config/config.yaml にコピーされます。
# プロジェクト固有の設定は .jj/config/config.yaml を編集してください。
#
# [READMEへ戻る](../README.md)

# ========================================================================
# プロジェクト基本設定
# ========================================================================

# プロジェクト名（root directoryノードの名前に使用）
# 未設定の場合はプロジェクトルートのフォルダ名を使用
# 使用例:
#   project-name: my-project
# project-name:

# ディレクトリ階層の最大深さ
# 未設定の場合は最終階層まで全ディレクトリをNode化（デフォルト）
# 1 = ルート直下のみ、2 = 直下+子ディレクトリまで
# CLI: --max-depth で上書き可能
# 使用例:
#   directory-max-depth: 3
# directory-max-depth:

# *INCLUDE探索の最大階層数
# Abaqus INPファイルの*INCLUDEディレクティブで参照されるファイルを
# cwdから再帰的に探索する際の最大階層数（デフォルト: 5）
# 使用例:
#   include-search-depth: 10
# include-search-depth: 5

# ========================================================================
# 語彙マッピング（vocab）
# ========================================================================
# ファイル名パース時にキー名を日本語表記に変換します。
# ダッシュボードのテーブル列やプロット軸の表示順にも影響します。
# vocab定義順 → 未定義キーは文字列昇順の順で表示されます。
# 使用例:
#   vocab:
#     idx: 条件
#     ver: バージョン
#     v: バージョン
#     temp: 温度
vocab:
  idx: 条件
  ver: バージョン
  v: バージョン

# ========================================================================
# トークン→キーマッピング（token-key-map）
# ========================================================================
# ファイル名のトークンを指定したキーのプロパティとして扱います。
# 通常のトークン分割(文字列+数値)より優先されます。
# 使用例:
#   mesh_hogehoge24_v1_idx1.inp で 形状: [hogehoge24] と定義すると
#   形状: hogehoge24 となり、さらにvocabに hogehoge24: ほげほげ24 があれば
#   形状: ほげほげ24 と最終変換されます。
# token-key-map:
#   形状:
#     - hogehoge24
#   解析タイプ:
#     - static
#     - dynamic

# ========================================================================
# パスパターンによるファイルタイプ指定（path-type-map）
# ========================================================================
# 上から順に評価し、最初にマッチしたルールを適用します。
# パターンはglobスタイルで、"|" で複数パターンを指定可能。
# 使用例:
#   "**go_* | **go":
#     "*.inp": Abaqusインプット
#     "*": 計算結果
path-type-map:
  "**go_* | **go":
    "*.inp": Abaqusインプット
    "*.cas.h5": Fluentインプット
    "*.aedt": HFSSインプット
    "*.sta": Abaqusステータス
    "*.dat": Abaqusデータ
    "*.odb": Abaqus ODB
    "*": 計算結果
  "**mesh_* | **mesh":
    "*.inp": Abaqus用メッシュ
    "*.msh": Fluent用メッシュ
    "*.cdb": ANSYS用メッシュ
  "**material_* | **material":
    "*.inp": Abaqus用マテリアル
  "**step_* | **step":
    "*.inp": Abaqusステップ
  "./reports/":
    "*": 報告書
  "./results/":
    "*": 計算結果
  "./tools/":
    "*": 処理スクリプト
  "./docs/":
    "*": 受領ファイル

# ========================================================================
# パスパターンによるプロパティ指定（path-property-map）
# ========================================================================
# マッチしたファイルに自動的にプロパティを付与します。
# 使用例:
#   "**old/*":
#     active: false
#   "**archive/*":
#     active: false
#     archived: true
path-property-map:
  "**old/*":
    active: false
  "**archive/*":
    active: false
    archived: true

# ========================================================================
# パスパターンによるタグ指定（path-tag-map）
# ========================================================================
# マッチしたファイルにタグを付与します。
# 使用例:
#   path-tag-map:
#     "**": projectA
#     "**/analysis/*": analysis-related
# path-tag-map:

# ========================================================================
# 除外パターン（ignore）
# ========================================================================
# マッチしたパスはパース対象から除外されます（.gitignore相当）。
# 使用例:
#   ignore:
#     - ".git"
#     - "*.tmp"
#     - "build/**"
ignore:
  - ".git"
  - ".git/**"
  - ".jj"
  - ".jj/**"
  - "__pycache__"
  - "__pycache__/**"
  - "*.pyc"
  - "node_modules"
  - "node_modules/**"
  - ".venv"
  - ".venv/**"
  - "*.tmp"
  - "*.bak"
  - "~$*"
  - ".DS_Store"
  - "Thumbs.db"
  - "notes"
  - "notes/**"
  - ".obsidian"
  - ".obsidian/**"

# ========================================================================
# ファイル関係設定（file-relations）
# ========================================================================
# 入力ファイルと結果ファイルの拡張子マッピング。
# 同一basenameで関連付けを行います。
# 使用例:
#   file-relations:
#     input-extensions:
#       - ".inp"
#     result-extensions:
#       - ".odb"
#     asset-extensions:
#       - ".stl"
file-relations:
  # 入力ファイルとして認識する拡張子
  input-extensions:
    - ".inp"      # Abaqus
    - ".cas.h5"   # Fluent
    - ".k"        # LS-DYNA
    - ".key"      # LS-DYNA
    - ".dat"      # 汎用入力
  # 結果ファイルとして認識する拡張子（入力ファイルと同じbasenameで関連付け）
  result-extensions:
    - ".odb"      # Abaqus ODB
    - ".sta"      # Abaqus status
    - ".msg"      # Abaqus message
    - ".csv"      # 抽出データ
    - ".json"     # 処理済みデータ
  # アセットファイルの拡張子（同じbasenameで derived_from 関係を構築）
  asset-extensions:
    - ".modfem"   # 修正済みメッシュ
    - ".stl"      # STLメッシュ
    - ".cdb"      # ANSYS CDB
    - ".msh"      # Fluent メッシュ

# ========================================================================
# キャッシュ設定
# ========================================================================
# ABQDataキャッシュの保持期間と最大保持数。
# parse実行後に古いキャッシュを自動クリーンアップします。
# 使用例:
#   cache-max-age-days: 60
#   cache-max-count: 200

# キャッシュ保持期間（日数、デフォルト: 30）
# cache-max-age-days: 30

# キャッシュ最大保持数（デフォルト: 100）
# cache-max-count: 100

# ========================================================================
# エクスポート設定（export）
# ========================================================================
export:
  # CSVエクスポート時の出力カラム（指定時はこれらのカラムのみ出力）
  # 未指定の場合は全カラムを出力。name/type/formatは常に含まれます。
  # globパターン対応（例: "stress*" で stress.center, stress.edge 等にマッチ）
  # 使用例:
  #   csv-columns:
  #     - 条件
  #     - バージョン
  #     - stress*
  # csv-columns:

  # 単位マッピング（カラム名 → 単位）
  # CSV出力時にカラム名に単位情報を付加します。
  # globパターン対応（例: "stress*": MPa で stress.center, stress.edge 等に適用）
  # 完全一致が優先されます。
  # 使用例:
  #   units:
  #     stress*: MPa
  #     荷重: N
  #     変位: mm
  #     質量: kg
  # units:

  # CSV単位表示形式
  # "header": {column}[{unit}] 形式（デフォルト）
  # "row": 1行目カラム名、2行目単位行
  csv-unit-format: header

# ========================================================================
# ダッシュボード設定（dashboard）
# ========================================================================
dashboard:
  # テーブルビューで表示するカラム（指定時はこれらのカラムのみ、優先順位順に表示）
  # 未指定の場合はvocab順で全カラムを表示。name/type/formatは常に先頭に含まれます。
  # globパターン対応（例: "stress*" で stress.center, stress.edge 等にマッチ）
  # 使用例:
  #   table-columns:
  #     - 条件
  #     - バージョン
  #     - analysis_status
  #     - active
  #     - stress*
  # table-columns:

  # デフォルトフィルタ（ダッシュボード起動時に適用）
  # ビュー間で共有され、session中保持されます。
  # 使用例:
  #   default-filters:
  #     active: true
  #     type: Abaqusインプット
  default-filters:
    active: true

  # プロットビューのデフォルト軸設定
  # 未指定の場合はプロパティキーリストの先頭から自動選択。
  # 使用例:
  #   plot:
  #     x: 条件
  #     y: RF3
  # plot:

  # ギャラリーのグリッド列数（デフォルト: 5）
  # 使用例:
  #   gallery-columns: 3
  # gallery-columns: 5

  # ギャラリーのグリッド行数（1ページあたりの行数、デフォルト: 4）
  # 使用例:
  #   gallery-rows: 6
  # gallery-rows: 4

  # 物性カーブ列名設定（material-curve-columns）
  # 物性一覧ページの列名推定に使用します。
  # 各プロパティキーに対して columns（列名リスト）と、
  # オプションで x/y（プロットのX軸/Y軸に使う列のインデックス）を指定します。
  # configにマッチしないプロパティは col_0, col_1, ... で補完されます。
  # 使用例:
  #   material-curve-columns:
  #     plastic:
  #       columns: [stress, strain]
  #       x: 1
  #       y: 0
  #     elastic:
  #       columns: [E, nu]
  material-curve-columns:
    plastic:
      columns: [stress, strain]
      x: 1
      y: 0
    elastic:
      columns: [E, nu]
    density:
      columns: [density]
    specific-heat:
      columns: [specific_heat]
    conductivity:
      columns: [conductivity]
    expansion:
      columns: [alpha]
    damage-initiation:
      columns: [value, strain]
      x: 1
      y: 0
    damage-evolution:
      columns: [displacement]
    creep:
      columns: [A, n, m]

  # 保存済みビュー（ダッシュボードの「保存済みビュー」ページに表示順で表示）
  # 各ビューにはフィルタ条件、プロット条件、ギャラリー条件を指定できます。
  # ビュータイプ: table / plot / gallery / card / status
  # 使用例:
  #   saved-views:
  #     - name: アクティブ解析一覧
  #       type: table
  #       filters:
  #         active: true
  #     - name: RF3 vs 条件
  #       type: plot
  #       filters:
  #         active: true
  #       plot:
  #         x: 条件
  #         y: RF3
  #         color: バージョン
  #         chart_type: 散布図
  #     - name: スクリーンショット
  #       type: gallery
  #       gallery:
  #         source: property
  #         property_key: screenshot
  # saved-views:

# ========================================================================
# Obsidian エクスポート設定（obsidian）
# ========================================================================
obsidian:
  # ノート出力先ディレクトリ（プロジェクトルート基準）
  notes-dir: notes/props
  # ベースファイル出力先ディレクトリ（プロジェクトルート基準）
  bases-dir: notes/bases
  # Obsidianファイルに付けるプレフィックス
  prefix: "O-"
  # デフォルトのビュー設定（.baseファイル用、Dataviewクエリ）
  # 使用例:
  #   default-views:
  #     - type: table
  #       name: Table
  #       filters:
  #         and:
  #           - "active == true"
  #       order:
  #         - file.name
  default-views:
    - type: table
      name: Table
      filters:
        and:
          - "file.fullname.endsWith(\".md\")"
          - "active == true"
      order:
        - file.name
        - idx
        - ver
        - success
        - description
      sort:
        - property: idx
          direction: ASC
        - property: ver
          direction: ASC
  # Vault設定（.obsidian/ディレクトリの自動生成内容）
  # jj export --target obsidian 初回実行時に反映される
  # 既存のVault（.obsidian/が存在する場合）には一切変更を加えない
  vault:
    # app.json: Obsidianアプリ設定
    app:
      useMarkdownLinks: false
      showFrontmatter: true
      strictLineBreaks: false
      readableLineLength: true
    # community-plugins.json: 推奨コミュニティプラグインID一覧
    # ObsidianのコミュニティプラグインストアからインストールするID
    community-plugins:
      - dataview
      - dbfolder
    # core-plugins-migration.json: コアプラグインの有効/無効設定
    core-plugins:
      canvas: true
      graph: true
      outgoing-link: true
      tag-pane: true
      backlink: true
      page-preview: true
      file-explorer: true
      global-search: true
      switcher: true
      markdown-importer: false
      note-composer: true
      command-palette: true
      editor-status: true
      bookmarks: true
      outline: true
      word-count: true
      file-recovery: true
      properties: true
