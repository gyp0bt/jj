# jj デフォルト設定ファイル（Abaqus ワークスペース既定）
# このファイルは jj の出荷時デフォルト。プロジェクト固有の上書きは
# .j2/config/config.yaml に記述する（同じキーを書けば上書きされる）。
#
# コア（parse/graph）は特定の CAE ソルバーを仮定しない設計に統一済み。
# 「どの拡張子を入力/結果として扱うか」等のソルバー固有の前提は、コードでは
# なく "この設定ファイル" が担う。出荷時デフォルトは最も一般的な
# **Abaqus ワークスペース** を想定して書いてある。別ソルバー（LS-DYNA /
# OpenFOAM 等）に切り替える場合は、下記の default-extensions / file-relations /
# path-type-map を差し替えるだけでよい。
#
# ここに無いキー（vocab, dashboard, obsidian など）は config/__init__.py の
# スキーマ既定値が使われる。
#
# [READMEへ戻る](../README.md)

# ----- デフォルト拡張子（default-extensions） ----------------------------
# jj parse のスキャン対象、およびファイル名解析（basename/拡張子判定）の候補。
# コアは .inp 等をハードコードしないため、Abaqus ワークスペースで扱う拡張子は
# ここで明示する。前半が Abaqus 固有、後半が汎用（スクリプト/データ/画像）。
default-extensions:
  # --- Abaqus ---
  - .inp        # 入力デック
  - .odb        # 結果データベース（バイナリ。NO_NODE によりNode化はされない）
  - .sta        # 解析ステータス
  - .msg        # メッセージ（収束情報等）
  - .dat        # データ/プリント出力
  - .cae        # Abaqus/CAE モデル
  # --- 汎用（解析ワークフローで併用するファイル） ---
  - .cas.h5
  - .dat.h5
  - .py
  - .xlsx
  - .csv
  - .pptx
  - .yaml
  - .md
  - .json
  - .sh
  - .msh
  - .stp
  - .step
  - .png
  - .gif

# ----- 入力/結果/アセットの対応（file-relations） ------------------------
# result_of リレーション（入力デック → 結果ファイル）の判定に使う。
# Abaqus 既定: 入力 .inp、結果 .odb/.sta/.msg/.dat。
# 同一 basename の入力と結果を結びつける（例: go_idx1_v2.inp → go_idx1_v2.odb）。
file-relations:
  input-extensions:
    - .inp
  result-extensions:
    - .odb
    - .sta
    - .msg
    - .dat
  asset-extensions:
    - .modfem
    - .stl
    - .cdb
    - .msh

# ----- パス → ファイルタイプ（path-type-map） ----------------------------
# go_ 配下の *.inp を「ABQ inp」として型付けする。
# ダッシュボードの type フィルタ（{"type": "ABQ inp"}）と get_go_table が依存。
# 結果ファイル（.sta/.dat/.odb 等）は「計算結果」にまとめる。
# ※ 結果データ（RF.*）の抽出は abaqus パーサーが拡張子と file-relations で
#   行うため、型名には依存しない。
path-type-map:
  "**go_* | **go":
    "*.inp": ABQ inp
    "*": 計算結果

# ----- 除外パターン ------------------------------------------------------
# .gitignore相当。マッチしたパスはパース対象から外れる。
# （省略するとスキーマ既定値は空になり .git/.j2 等まで走査してしまうため残す）
ignore:
  - ".git"
  - ".git/**"
  - ".j2"
  - ".j2/**"
  - "__pycache__"
  - "__pycache__/**"
  - ".venv"
  - ".venv/**"

# ----- エクスポート設定（jj export） -------------------------------------
# CSV単位の表示形式: header → 列名に [unit] を付加 / row → 1列目に単位行
export:
  csv-unit-format: header
