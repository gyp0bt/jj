# jj デフォルト設定ファイル（最小版）
# このファイルは jj の出荷時デフォルト。プロジェクト固有の上書きは
# .j2/config/config.yaml に記述する（同じキーを書けば上書きされる）。
#
# ここには「Streamlitダッシュボード（応力–ひずみ）と jj export が動く最小限」
# だけを残してある。ここに無いキー（vocab, default-extensions, file-relations,
# dashboard, obsidian など）は config/__init__.py のスキーマ既定値が使われる。
#
# [READMEへ戻る](../README.md)

# ----- パス → ファイルタイプ（path-type-map） ----------------------------
# go_ 配下の *.inp を「ABQ inp」として型付けする。
# ダッシュボードの type フィルタ（{"type": "ABQ inp"}）と get_go_table が依存。
# 結果ファイル（.sta/.dat/.odb 等）は「計算結果」にまとめる。
# ※ 結果データ（RF.*）の抽出は abaqus パーサーが拡張子と file-relations
#   （スキーマ既定値）で行うため、型名には依存しない。
path-type-map:
  "**go_* | **go":
    "*.inp": ABQ inp
    "*": 計算結果

# ----- 除外パターン ------------------------------------------------------
# .gitignore相当。マッチしたパスはパース対象から外れる。
# （省略するとスキーマ既定値は空になり .git/.j2 等まで走査してしまうため残す）
ignore:
  - ".git"
  - ".git/**"
  - ".j2"
  - ".j2/**"
  - "__pycache__"
  - "__pycache__/**"
  - ".venv"
  - ".venv/**"

# ----- エクスポート設定（jj export） -------------------------------------
# CSV単位の表示形式: header → 列名に [unit] を付加 / row → 1列目に単位行
export:
  csv-unit-format: header
