# PyTorch training configuration
model:
  name: ResNet18
  num_classes: 10
  pretrained: true

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001
  scheduler: cosine

data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augmentation: true

experiment:
  name: baseline_resnet18
  seed: 42
