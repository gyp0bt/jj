# Hyperparameter sweep configuration
study_name: resnet_hparam_search
n_trials: 100
objective: minimize
metric: val_loss

search_space:
  learning_rate:
    type: loguniform
    low: 0.0001
    high: 0.01
  batch_size:
    type: categorical
    choices: [16, 32, 64, 128]
  dropout:
    type: uniform
    low: 0.1
    high: 0.5
