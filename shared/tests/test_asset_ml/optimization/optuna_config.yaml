study_name: surrogate_optimization
n_trials: 100
objective: minimize
direction: minimize
search_space:
  learning_rate:
    type: float
    low: 0.0001
    high: 0.1
    log: true
  batch_size:
    type: categorical
    choices: [16, 32, 64, 128]
  n_layers:
    type: int
    low: 1
    high: 5
sampler: TPESampler
pruner: MedianPruner
