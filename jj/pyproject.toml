[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jj"
version = "0.1.0"
description = "CAEプロジェクトグラフデータ構築ツール"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    # Abaqusプラグインがモジュールレベルでimportするため必須
    "chardet>=5.0.0",
    "ftfy>=6.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# pymesh（メッシュ操作・解析モジュール）
pymesh = [
    "pandas>=2.0.0",
    "chardet>=5.0.0",
    "ftfy>=6.0.0",
]
# Abaqusプラグイン追加依存（メッシュ品質解析・データ分析用）
abaqus = [
    "jj[pymesh]",
    "scipy>=1.10.0",
]
# Obsidianプラグイン依存
obsidian = [
    "pyyaml>=6.0",
]
# ダッシュボード（jj dashboard）
dashboard = [
    "streamlit>=1.30.0",
    "streamlit-aggrid>=1.0.0",
    "plotly>=5.0.0",
]
# REST API（jj serve）
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
]
# Neo4jコネクター
neo4j = [
    "neo4j>=5.0.0",
]
# LS-DYNAプラグイン依存（将来: d3plot解析等）
# lsdyna = []
# Flow-3Dプラグイン依存（将来: 結果ファイル解析等）
# flow3d = []
# OpenFOAMプラグイン依存（将来: メッシュ解析等）
# openfoam = []
# CalculiXプラグイン依存（将来: .frd解析等）
# calculix = []
# Fluentプラグイン依存（HDF5ファイル解析用）
fluent = [
    "h5py>=3.0.0",
]
# HFSSプラグイン依存（現時点で追加依存なし）
# hfss = []
# SSH操作
ssh = [
    "paramiko>=3.0.0",
]
# 開発・テスト
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.25.0",
]
# 全依存（便宜上）
all = [
    "jj[pymesh,abaqus,obsidian,fluent,dashboard,api,neo4j,ssh,dev]",
]

# --------------------------------------------------
# entry_points: プラグイン登録
# --------------------------------------------------
# jj.plugins グループ: プラグインパッケージ全体のエントリ
# 各entry_pointの値はregister()関数を公開するモジュール
[project.entry-points."jj.plugins"]
abaqus = "services.plugins.abaqus:register"
obsidian = "services.plugins.obsidian:register"
lsdyna = "services.plugins.lsdyna:register"
flow3d = "services.plugins.flow3d:register"
openfoam = "services.plugins.openfoam:register"
calculix = "services.plugins.calculix:register"
fluent = "services.plugins.fluent:register"
hfss = "services.plugins.hfss:register"

# jj.parsers グループ: 個別パーサーの登録（外部プラグイン用の拡張点）
# 内蔵プラグインはjj.plugins経由でまとめて登録されるため、ここは空でもよい
# [project.entry-points."jj.parsers"]

# jj.exporters グループ: 個別エクスポーターの登録
# [project.entry-points."jj.exporters"]

# jj.dashboard_connectors グループ: 個別ダッシュボードコネクターの登録
# [project.entry-points."jj.dashboard_connectors"]

[project.scripts]
jj = "services.cli:main"

[tool.setuptools.packages.find]
include = [
    "services*",
    "jj_types*",
    "config*",
    "modules*",
    "cli*",
    "shared*",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatterに任せる)
    "B008",   # do not perform function call in argument defaults (Pydantic/FastAPI互換)
    "SIM108", # use ternary (可読性の判断はケースバイケース)
    "RUF001", # ambiguous unicode character in string (日本語文字列で意図的に使用)
    "RUF002", # ambiguous unicode character in docstring (日本語docstringで意図的に使用)
    "RUF003", # ambiguous unicode character in comment (日本語コメントで意図的に使用)
]

[tool.ruff.lint.isort]
known-first-party = ["services", "jj_types", "config", "modules", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
