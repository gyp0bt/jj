[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jj"
version = "0.2.1"
description = "CAEプロジェクトグラフデータ構築ツール（軽量版）"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    # Abaqusプラグインがモジュールレベルでimportするため必須
    "chardet>=5.0.0",
    "ftfy>=6.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# pymesh（メッシュ操作・解析モジュール）
pymesh = [
    "pandas>=2.0.0",
    "chardet>=5.0.0",
    "ftfy>=6.0.0",
    "scipy>=1.10.0",
    "plotly>=5.0.0",
]
# Abaqusプラグイン追加依存（メッシュ品質解析・データ分析用）
abaqus = [
    "jj[pymesh]",
    "scipy>=1.10.0",
]
# Obsidianプラグイン依存
obsidian = [
    "pyyaml>=6.0",
]
# Streamlitダッシュボード（services/dashboard/app/）依存
# `streamlit run services/dashboard/app/Home.py` で起動するUI層。
# DashboardDataProvider 自体はコア依存のみで動作し、これらはUI表示専用。
dashboard = [
    "streamlit>=1.30.0",
    "streamlit-aggrid>=1.0.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]
# 開発・テスト
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# 全依存（便宜上）
all = [
    "jj[pymesh,abaqus,obsidian,dashboard,dev]",
]

# --------------------------------------------------
# entry_points: プラグイン登録
# --------------------------------------------------
# jj.plugins グループ: プラグインパッケージ全体のエントリ
# 各entry_pointの値はregister()関数を公開するモジュール
[project.entry-points."jj.plugins"]
abaqus = "plugins.abaqus:register"
obsidian = "plugins.obsidian:register"

[project.scripts]
jj = "services.cli:main"

[tool.setuptools.packages.find]
include = [
    "jj",
    "plugins*",
    "services*",
    "jj_types*",
    "config*",
    "modules*",
    "cli*",
    "shared*",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatterに任せる)
    "B008",   # do not perform function call in argument defaults (Pydantic/FastAPI互換)
    "SIM108", # use ternary (可読性の判断はケースバイケース)
    "RUF001", # ambiguous unicode character in string (日本語文字列で意図的に使用)
    "RUF002", # ambiguous unicode character in docstring (日本語docstringで意図的に使用)
    "RUF003", # ambiguous unicode character in comment (日本語コメントで意図的に使用)
]

[tool.ruff.lint.isort]
known-first-party = ["plugins", "services", "jj_types", "config", "modules", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.workspace]
members = [
    "tmp",
]
