name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Python (jj)
  # ─────────────────────────────────────────────
  python-lint:
    name: "Python: ruff lint + format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  python-test:
    name: "Python: pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q

  python-plugin-integration:
    name: "Python: plugin integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify plugin entry_points
        run: python -c "from importlib.metadata import entry_points; eps = entry_points(); jj_eps = eps.select(group='jj.plugins'); names = [ep.name for ep in jj_eps]; assert 'abaqus' in names, f'abaqus not found in {names}'; print(f'Registered plugins: {names}')"
      - name: Run plugin integration tests
        run: pytest tests/test_plugin_integration.py --tb=short -q -v

  python-dashboard-e2e:
    name: "Python: dashboard E2E (Streamlit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" streamlit
      - name: Run dashboard E2E tests
        run: pytest tests/test_dashboard_e2e.py --tb=short -q -v
